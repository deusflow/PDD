<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="52%" stop-color="#1E293B" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mistBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="groundSlope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="roadSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="beamOncoming" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="hazardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="triangleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="675" fill="url(#skyNight)" />
  <circle cx="930" cy="128" r="110" fill="url(#moonGlow)" />
  <circle cx="930" cy="128" r="24" fill="#E2E8F0" opacity="0.88" />
  <g fill="#F8FAFC" opacity="0.55">
    <circle cx="170" cy="84" r="2.2" />
    <circle cx="310" cy="54" r="1.8" />
    <circle cx="490" cy="96" r="2" />
    <circle cx="670" cy="62" r="2.4" />
    <circle cx="1080" cy="78" r="2" />
  </g>

  <!-- Rolling hills & distant wind turbines -->
  <path d="M0 320 Q220 265 480 305 T960 288 L1200 310 L1200 420 L0 420 Z" fill="#1E293B" />
  <path d="M0 345 Q310 305 640 340 T1200 326 L1200 450 L0 450 Z" fill="#283548" />

  <!-- Distant Danish wind turbines -->
  <g stroke="#64748B" stroke-width="2.5" stroke-linecap="round" opacity="0.72">
    <line x1="210" y1="295" x2="210" y2="215" />
    <line x1="210" y1="215" x2="184" y2="195" />
    <line x1="210" y1="215" x2="236" y2="198" />
    <line x1="210" y1="215" x2="212" y2="246" />
    <line x1="290" y1="302" x2="290" y2="236" />
    <line x1="290" y1="236" x2="268" y2="220" />
    <line x1="290" y1="236" x2="312" y2="222" />
    <line x1="290" y1="236" x2="291" y2="262" />
  </g>

  <!-- Roadside terrain -->
  <rect x="0" y="348" width="1200" height="327" fill="url(#groundSlope)" />

  <!-- Misty horizon band -->
  <rect x="0" y="295" width="1200" height="125" fill="url(#mistBand)" />

  <!-- Winding road -->
  <path d="M510 348 L590 348 C650 430 920 510 1190 675 L50 675 C270 520 435 425 510 348 Z" fill="url(#roadSurface)" />

  <!-- Soft shoulder / verge on the right -->
  <path d="M584 348 L602 348 C685 430 960 510 1200 660 L1200 675 L1075 675 C840 535 642 435 584 348 Z" fill="#475569" opacity="0.55" />

  <!-- Road edge & center markings -->
  <path d="M518 348 C446 425 282 520 75 675" stroke="#E2E8F0" stroke-width="4" opacity="0.7" />
  <path d="M582 348 C646 430 890 522 1085 675" stroke="#E2E8F0" stroke-width="5" opacity="0.85" />
  <path d="M550 352 C548 430 562 535 615 675" stroke="#F8FAFC" stroke-width="5" stroke-dasharray="26 22" opacity="0.82" />

  <!-- Danish roadside delineator posts with amber reflectors -->
  <g>
    <rect x="462" y="368" width="5" height="22" rx="1.5" fill="#E2E8F0" />
    <rect x="462" y="372" width="5" height="5" fill="#F59E0B" />
    <rect x="355" y="438" width="7" height="34" rx="2" fill="#E2E8F0" />
    <rect x="355" y="444" width="7" height="7" fill="#F59E0B" />
    <rect x="195" y="538" width="10" height="48" rx="2.5" fill="#E2E8F0" />
    <rect x="195" y="546" width="10" height="9" fill="#F59E0B" />

    <rect x="625" y="366" width="5" height="22" rx="1.5" fill="#E2E8F0" />
    <rect x="625" y="370" width="5" height="5" fill="#F59E0B" />
    <rect x="752" y="432" width="7" height="34" rx="2" fill="#E2E8F0" />
    <rect x="752" y="438" width="7" height="7" fill="#F59E0B" />
  </g>

  <!-- Oncoming car on left lane with dipped low-beam cones -->
  <g transform="translate(468, 396)">
    <polygon points="-24,10 -125,95 -48,95 -8,10" fill="url(#beamOncoming)" />
    <polygon points="24,10 -18,95 62,95 36,10" fill="url(#beamOncoming)" />
    <ellipse cx="0" cy="24" rx="44" ry="8" fill="#09090B" opacity="0.5" />
    <rect x="-36" y="-8" width="72" height="28" rx="8" fill="#64748B" stroke="#CBD5E1" stroke-width="1.5" />
    <path d="M-24 -8 L-14 -24 L14 -24 L24 -8 Z" fill="#475569" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="-18" y="-21" width="36" height="11" rx="3" fill="#0F172A" />
    <rect x="-31" y="2" width="12" height="6" rx="2" fill="#FEF08A" />
    <rect x="19" y="2" width="12" height="6" rx="2" fill="#FEF08A" />
  </g>

  <!-- Stopped car safely on right shoulder with amber hazard lights -->
  <g transform="translate(808, 456)">
    <ellipse cx="4" cy="40" rx="84" ry="15" fill="#020617" opacity="0.58" />
    <circle cx="-54" cy="8" r="28" fill="url(#hazardGlow)" />
    <circle cx="54" cy="8" r="28" fill="url(#hazardGlow)" />
    <!-- Car body -->
    <rect x="-66" y="-12" width="132" height="46" rx="14" fill="#3B82F6" stroke="#BFDBFE" stroke-width="2" />
    <path d="M-46 -12 L-28 -44 L30 -44 L48 -12 Z" fill="#2563EB" stroke="#BFDBFE" stroke-width="2" />
    <rect x="-32" y="-37" width="64" height="21" rx="5" fill="#0F172A" />
    <line x1="-22" y1="-34" x2="6" y2="-20" stroke="#93C5FD" stroke-width="2" opacity="0.35" />
    <!-- Rear bumper & white plate -->
    <rect x="-24" y="16" width="48" height="11" rx="2.5" fill="#F8FAFC" />
    <!-- Taillights + hazard blinkers -->
    <rect x="-60" y="0" width="22" height="10" rx="3" fill="#EF4444" />
    <rect x="38" y="0" width="22" height="10" rx="3" fill="#EF4444" />
    <circle cx="-56" cy="11" r="6" fill="#F59E0B" />
    <circle cx="56" cy="11" r="6" fill="#F59E0B" />
    <!-- Wheels -->
    <rect x="-56" y="26" width="20" height="15" rx="4" fill="#09090B" />
    <rect x="36" y="26" width="20" height="15" rx="4" fill="#09090B" />
  </g>

  <!-- Bright red reflective warning triangle placed cleanly behind stopped car -->
  <g transform="translate(972, 575)">
    <ellipse cx="0" cy="40" rx="52" ry="10" fill="#020617" opacity="0.5" />
    <circle cx="0" cy="4" r="68" fill="url(#triangleGlow)" />
    <line x1="-28" y1="36" x2="28" y2="36" stroke="#94A3B8" stroke-width="5" stroke-linecap="round" />
    <polygon points="0,-36 40,32 -40,32" fill="#1E293B" stroke="#EF4444" stroke-width="11" stroke-linejoin="round" />
    <polygon points="0,-16 21,21 -21,21" fill="none" stroke="#FCA5A5" stroke-width="2.5" stroke-linejoin="round" />
  </g>

  <!-- Soft foreground mist veil -->
  <path d="M0 540 Q320 510 660 545 T1200 520 L1200 675 L0 675 Z" fill="#94A3B8" opacity="0.09" />
</svg>
